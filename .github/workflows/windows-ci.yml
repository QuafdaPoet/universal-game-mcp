name: Windows CI - Universal Game MCP (UGM)

on:
  push:
    branches: [ main, master, 'release/**' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate Offline Fixtures and Icon Templates
        run: |
          python scripts/generate_fixtures.py

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -v --tb=short

      - name: Run CPU Latency and RAM Profiling Benchmark
        run: |
          python scripts/benchmark_cpu_ram.py

      - name: Measure synthetic MCP capture memory
        run: |
          python -m scripts.benchmark_mcp_capture_memory --width 1920
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.benchmark_mcp_capture_memory --width 3840

      - name: Run End-to-End Offline Simulator Demo
        run: |
          python scripts/demo_offline_sim.py


      - name: Check installed wheel outside the checkout
        shell: pwsh
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = (Get-ChildItem dist/universal_game_mcp-*.whl).FullName
          python -m pip install --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $env:RUNNER_TEMP
          try {
            python -m ugm.server --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -c "from pathlib import Path; from importlib.metadata import version; from ugm import __version__; from ugm.server import DEFAULT_SKILLS_PACK; from ugm.skills.loader import GameSkillPackLoader; p = GameSkillPackLoader.load_pack(DEFAULT_SKILLS_PACK); assert p.skills and p.selectors and (Path(p.templates_dir) / 'pause_btn.png').is_file(); assert version('universal-game-mcp') == __version__"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
