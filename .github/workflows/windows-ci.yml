name: Windows CI - Universal Game MCP (UGM)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate Offline Fixtures and Icon Templates
        run: |
          python scripts/generate_fixtures.py

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -v --tb=short

      - name: Run CPU Latency and RAM Profiling Benchmark
        run: |
          python scripts/benchmark_cpu_ram.py

      - name: Run End-to-End Offline Simulator Demo
        run: |
          python scripts/demo_offline_sim.py
