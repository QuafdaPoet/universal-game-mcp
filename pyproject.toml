[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-game-mcp"
version = "1.0.0"
description = "Universal Game MCP (UGM): AI-driven observation, OCR, icon detection, safe inputs, and verification for offline games."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "UGM Community" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "bettercam>=1.0.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pydirectinput>=1.0.4",
    "pywin32>=306",
    "rapidocr-onnxruntime>=1.3.8",
    "mss>=9.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
ugm-server = "ugm.server:main"

[tool.setuptools.packages.find]
include = ["ugm*"]
